<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9A4220" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Classe "js" (animações de entrada) e cortina fechada quando vem de outra página do site.
      document.documentElement.classList.add('js');
      // Segurança: se o JavaScript não rodar em 4 s, mostra tudo sem animação.
      setTimeout(function () { if (!window.__crosta) document.documentElement.classList.add('no-anim'); }, 4000);
      try { if (sessionStorage.getItem('pt')) { document.documentElement.classList.add('pt-in'); sessionStorage.removeItem('pt'); } } catch (e) {}
    </script>
    <!--head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
